<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Block Escape — Prototype 0.2</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><small>STUDIO / PROTOTYPE 0.2</small><h1>BLOCK <span>ESCAPE</span></h1></div><button id="sound" type="button" aria-label="Sesi kapat" aria-pressed="true" title="Ses açık">♪</button></header><section class="hud"><div><small>BÖLÜM</small><strong id="levelLabel">01 / 10</strong></div><div><small>KALAN BLOK</small><strong id="remaining">0</strong></div><div><small>HAMLE</small><strong id="moves">0</strong></div></section><p id="hint" class="hint">Bloklara dokun. Yolu açıksa ok yönünde çıkar.</p><div id="board" class="board" role="group" aria-label="Oyun tahtası"></div><div id="toast" class="toast" aria-live="polite"></div><section class="controls"><button id="undo">↶ Geri al</button><button id="reset">⟳ Yeniden başlat</button></section><footer>İlerleme bu tarayıcıda kaydedilir. <button id="levelsBtn">Bölümler</button></footer></main><div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal"><h2 id="modalTitle">Tebrikler!</h2><p id="modalText"></p><div id="levelPicker" class="level-picker hidden"></div><button id="next" class="primary">Sonraki bölüm →</button><button id="close" class="secondary">Kapat</button></div></div><script src="game.js"></script></body></html>
