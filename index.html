<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Block Escape — Prototype 0.4</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="menu.css"></head><body>
<section id="menu" class="menu" aria-labelledby="menuTitle">
  <div class="menu-background" aria-hidden="true">
    <div class="sky-art"></div><i class="cloud cloud-one"></i><i class="cloud cloud-two"></i>
    <img class="distant-island island-left" src="assets/foreground-island.png" alt="" width="1310" height="1201">
    <img class="distant-island island-right" src="assets/foreground-island.png" alt="" width="1310" height="1201">
    <i class="sky-spark spark-one">✦</i><i class="sky-spark spark-two">✧</i>
  </div>
  <div class="menu-content">
    <div class="menu-toolbar"><button id="menuSound" type="button" aria-label="Sesi kapat" aria-pressed="true">♪</button></div>
    <h1 id="menuTitle" class="menu-logo"><span class="visually-hidden">BLOCK ESCAPE</span><img src="assets/logo.svg" width="640" height="320" alt=""></h1>
    <div class="menu-scene" aria-hidden="true">
      <img class="island-layer" src="assets/foreground-island.png" width="1310" height="1201" alt="">
      <img class="bloop-layer" src="assets/bloop.png" width="1413" height="1113" alt="">
    </div>
    <div class="menu-actions" aria-label="Ana menü">
      <button id="playBtn" class="menu-button play-button" type="button"><span aria-hidden="true" class="play-icon"></span> OYNA</button>
      <button id="menuLevels" class="menu-button levels-button" type="button"><span aria-hidden="true">▦</span> BÖLÜM SEÇ</button>
      <p id="menuProgress" class="menu-progress"></p>
    </div>
    <button id="motionToggle" type="button" aria-pressed="false">Hareketi durdur</button>
  </div>
</section>
<main class="app" hidden><header><div><small>STUDIO / PROTOTYPE 0.4</small><h1>BLOCK <span>ESCAPE</span></h1></div><button id="sound" type="button" aria-label="Sesi kapat" aria-pressed="true" title="Ses açık">♪</button></header><section class="hud"><div><small>BÖLÜM</small><strong id="levelLabel">01 / 10</strong></div><div><small>KALAN BLOK</small><strong id="remaining">0</strong></div><div><small>HAMLE</small><strong id="moves">0</strong></div></section><p id="hint" class="hint">Bloklara dokun. Yolu açıksa ok yönünde çıkar.</p><div id="board" class="board" role="group" aria-label="Oyun tahtası"></div><div id="toast" class="toast" aria-live="polite"></div><section class="controls"><button id="undo">↶ Geri al</button><button id="reset">⟳ Yeniden başlat</button></section><footer><button id="homeBtn" type="button">⌂ Ana menü</button><br>İlerleme bu tarayıcıda kaydedilir. <button id="levelsBtn">Bölümler</button></footer></main><div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><h2 id="modalTitle">Tebrikler!</h2><p id="modalText"></p><div id="levelPicker" class="level-picker hidden"></div><button id="next" class="primary">Sonraki bölüm →</button><button id="close" class="secondary">Kapat</button></div></div><script src="game.js"></script><script src="menu.js"></script></body></html>
